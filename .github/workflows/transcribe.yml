name: transcribe-quran
on:
  workflow_dispatch:
    inputs:
      model:
        description: "HF model id (Quran-tuned Whisper)"
        default: "tarteel-ai/whisper-base-ar-quran"
      beams:
        description: "Beam size (1 = greedy, 5 = more accurate / slower)"
        default: "5"
  push:
    paths: ["audio/**"]
concurrency:
  group: transcribe
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers accelerate
      - name: Build Quran json
        run: python build_quran.py data/ARQURAN.TXT data/quran.json
      - name: Transcribe + align
        run: |
          read MODEL BEAMS STRIDE < config/model.txt
          TAG=$(basename "$MODEL")
          mkdir -p "results/$TAG"; shopt -s nullglob
          ls audio/*.flac || { echo "no audio"; exit 1; }
          for f in audio/*.flac; do
            n=$(basename "$f" .flac)
            python transcribe.py "$f" "results/$TAG/$n.raw.json" "$MODEL" "$BEAMS" "$STRIDE"
            python align.py "results/$TAG/$n.raw.json" data/quran.json "results/$TAG/$n.aligned.json"
          done
      - name: Commit results
        run: |
          git config user.name "transcribe-bot"; git config user.email "bot@users.noreply.github.com"
          git add results && git commit -m "Transcription results" && git pull --rebase -q origin main; git push
